; Mac/Linux example — copy to a path outside repo or keep local.
; Integral / Neon-style quote tunnel: plain FIX on localhost -> TLS to venue.
; Align "accept" with external_feed.fix.port and host in default_config.json (default 127.0.0.1:14507).
;
; Run (leave terminal open, or omit foreground=yes for daemon mode):
;   stunnel /path/to/integral_quote.conf
;
; Verify before trading_client:
;   lsof -nP -iTCP:14507 -sTCP:LISTEN
;   nc -zv 127.0.0.1 14507
;
; If the log shows TLS OK then immediately "TLS alert (read): warning: close notify" and
; "164 byte(s) sent to TLS, 0 byte(s) sent to socket", the venue closed after your first
; write (often FIX Logon) without sending application data. Common causes:
;   - SNI: stunnel sends the IP as server name by default; Neon may require a hostname.
;     Ask Neon for the exact TLS server name and add under [Integral Quote]:
;       sni = hostname.they.document
;   - Source IP not allowlisted for your FIX account.
;   - Wrong port/environment (demo vs prod).

foreground = yes
client = yes
debug = 7
output = /tmp/stunnel-integral.log
fips = no
sslVersion = TLSv1.2
ciphers = ALL

socket = l:TCP_NODELAY=1
socket = r:TCP_NODELAY=1

[Integral Quote]
accept = 127.0.0.1:14506
connect = 208.184.46.37:14506
; If Neon/Integral docs give a hostname for TLS, set it (do not guess — confirm with them):
; sni = example.replace-with-venue-hostname.example
